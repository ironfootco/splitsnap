<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SplitSnap - Master Frame Puncher</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        .box { max-width: 650px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 10px; border: 1px solid #333; }
        h1 { color: #ff6b00; margin-top: 0; }
        .drop-zone { border: 2px dashed #666; border-radius: 8px; padding: 30px; cursor: pointer; margin: 20px 0; background: #252525; }
        .drop-zone:hover { border-color: #ff6b00; }
        button { background: #ff6b00; color: #fff; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; display: none; width: 100%; }
        button:hover { background: #e05e00; }
        canvas { max-width: 100%; height: auto; border: 1px solid #444; margin-top: 20px; display: none; background: repeating-conic-gradient(#333 0% 25%, #222 0% 50%) 50% / 20px 20px; }
    </style>
</head>
<body>

<div class="box">
    <h1>SplitSnap Frame Forge</h1>
    <p style="color:#aaa; font-size:14px;">Drop any solid 4:5 image below. It will instantly punch out crystal-clear windows and export a production-ready transparent PNG.</p>
    
    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
        <span id="label">📁 Click or Drag Raw Artwork Here</span>
        <input type="file" id="fileInput" accept="image/*" style="display:none">
    </div>

    <button id="downloadBtn" onclick="savePng()">Export Transparent Master Frame (.PNG)</button>
    <canvas id="canvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = 1080;
    const H = 1350;
    canvas.width = W;
    canvas.height = H;

    document.getElementById('fileInput').addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) processFile(e.target.files[0]);
    });

    function processFile(file) {
        const img = new Image();
        img.onload = () => {
            // 1. Draw raw background artwork scaled to 1080x1350
            ctx.clearRect(0, 0, W, H);
            ctx.drawImage(img, 0, 0, W, H);

            // 2. Window Geometry (Standardized SplitSnap 4:5 Stack)
            const marginX = 54;
            const winW = W - (marginX * 2); // 972px wide
            
            // Top Window (x, y, w, h)
            const topY = 150;
            const topH = 490;
            
            // Bottom Window (x, y, w, h)
            const botY = 710;
            const botH = 490;

            // 3. Laser Cut The Glass (Punch holes directly through pixels)
            ctx.save();
            ctx.globalCompositeOperation = 'destination-out';
            
            // Punch Top Hole
            ctx.fillRect(marginX, topY, winW, topH);
            // Punch Bottom Hole
            ctx.fillRect(marginX, botY, winW, botH);
            ctx.restore();

            // 4. Subtle Inner Pinstripe Border (Gives the cutout a crisp, pro bevel)
            ctx.strokeStyle = "rgba(0, 0, 0, 0.4)";
            ctx.lineWidth = 4;
            ctx.strokeRect(marginX, topY, winW, topH);
            ctx.strokeRect(marginX, botY, winW, botH);

            canvas.style.display = 'block';
            const dl = document.getElementById('downloadBtn');
            dl.style.display = 'block';
            document.getElementById('label').textContent = '✓ ' + file.name + ' Ready!';
        };
        img.src = URL.createObjectURL(file);
    }

    function savePng() {
        const a = document.createElement('a');
        a.download = 'frame_' + Date.now() + '.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
    }
</script>
</body>
</html>
