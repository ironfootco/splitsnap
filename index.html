<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SplitSnap - Before & After Generator</title>
    
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #0f1115; 
            color: #fff; 
            padding: 15px; 
            text-align: center; 
            margin: 0; 
        }
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: #1a1d24; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.6); 
        }
        h1 { 
            color: #ff6b00; /* Vibrant SplitSnap Orange */
            margin-top: 0; 
            font-size: 24px; 
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .controls { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            margin-bottom: 15px; 
            text-align: left; 
        }
        .card { 
            background: #232730; 
            padding: 14px 16px; 
            border-radius: 8px; 
            border: 1px solid #333; 
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .card-title { 
            font-weight: 700; 
            color: #ccc; 
            font-size: 13px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        select, input[type="text"] { 
            display: block; 
            width: 100%; 
            color: #fff; 
            background: #16181d;
            border: 1px solid #444;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px; 
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        input[type="text"]:focus { outline: none; border-color: #ff6b00; }
        
        .btn-upload {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            box-sizing: border-box;
            background: #2a2e39;
            border: 1px dashed #555;
            color: #eee;
            padding: 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn-upload:active { background: #333; border-color: #ff6b00; }
        .btn-upload.ready { background: #1c2b1e; border: 1px solid #2e7d32; color: #81c784; }

        .btn-reset { 
            background: transparent; 
            color: #777; 
            padding: 3px 8px; 
            font-size: 11px; 
            font-weight: 600; 
            border-radius: 4px; 
            border: 1px solid #444; 
            cursor: pointer; 
            text-transform: uppercase;
        }
        .btn-reset:hover { background: #3a3a3a; color: #ccc; }

        .download-btn { 
            padding: 16px; 
            font-size: 16px; 
            border-radius: 8px; 
            border: none; 
            background: #007aff; 
            color: #fff; 
            font-weight: bold; 
            text-transform: uppercase; 
            cursor: pointer; 
            width: 100%;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0,122,255,0.3);
            display: none;
        }
        .download-btn:active { background: #005bb5; }
        
        .gesture-hint { display: none; font-size: 12px; color: #aaa; margin-top: 15px; margin-bottom: 5px; }

        canvas { 
            max-width: 100%; 
            height: auto; 
            border-radius: 4px;
            margin-top: 10px; 
            display: none;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            cursor: grab;
        }
        canvas:active { cursor: grabbing; }
    </style>
</head>
<body>

<div class="container">
    <h1><span style="color:#fff;">Split</span>Snap</h1>
    
    <div class="controls">
        <!-- THEME SELECTOR -->
        <div class="card">
            <div class="card-header"><span class="card-title">1. Choose Theme</span></div>
            <select id="themeSelect" onchange="changeTheme()">
                <!-- Populated by JS -->
            </select>
        </div>

        <!-- TOP / LEFT PHOTO -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">2. Primary Photo</span>
                <button type="button" class="btn-reset" onclick="resetPosition('b')">↺ Reset</button>
            </div>
            <input type="text" id="topText" placeholder="Top Label (e.g. BEFORE)" oninput="runGenerate()">
            <label for="beforeImage" class="btn-upload" id="bUploadBtn">
                <span>📷</span><span id="bText">Tap to Select Photo</span>
            </label>
            <input type="file" id="beforeImage" accept="image/*" style="display:none">
            <input type="hidden" id="bZoom" value="100">
            <input type="hidden" id="bX" value="0">
            <input type="hidden" id="bY" value="0">
        </div>
        
        <!-- BOTTOM / RIGHT PHOTO -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">3. Secondary Photo</span>
                <button type="button" class="btn-reset" onclick="resetPosition('a')">↺ Reset</button>
            </div>
            <input type="text" id="bottomText" placeholder="Bottom Label (e.g. AFTER)" oninput="runGenerate()">
            <label for="afterImage" class="btn-upload" id="aUploadBtn">
                <span>📷</span><span id="aText">Tap to Select Photo</span>
            </label>
            <input type="file" id="afterImage" accept="image/*" style="display:none">
            <input type="hidden" id="aZoom" value="100">
            <input type="hidden" id="aX" value="0">
            <input type="hidden" id="aY" value="0">
        </div>

        <button id="downloadBtn" class="download-btn" onclick="downloadImage()">Download to Device</button>
    </div>

    <div id="gestureHint" class="gesture-hint">👆 Drag photos to reposition • Pinch to zoom</div>
    <canvas id="canvas"></canvas>
</div>

<script>
    // ==========================================
    // MODULAR THEME CATALOG
    // ==========================================
    const THEMES = [
        {
            id: "clean_modern_stack",
            name: "Modern Minimalist (Over/Under)",
            type: "stack",
            width: 1080,
            height: 1350,
            overlayUrl: "overlay_minimal_stack.png", // Must be a transparent PNG
            defaultTop: "BEFORE",
            defaultBottom: "AFTER"
        },
        {
            id: "halloween_kids",
            name: "Halloween Spooky (Over/Under)",
            type: "stack",
            width: 1080,
            height: 1350,
            overlayUrl: "overlay_halloween.png",
            defaultTop: "THE KID",
            defaultBottom: "THE COSTUME"
        },
        {
            id: "classic_square",
            name: "Classic Square (Side-by-Side)",
            type: "side",
            width: 1080,
            height: 1080,
            overlayUrl: "overlay_square.png",
            defaultTop: "THEN",
            defaultBottom: "NOW"
        }
    ];

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let loadedBefore = null;
    let loadedAfter = null;
    let currentOverlay = null;

    // Init UI
    const themeSelect = document.getElementById('themeSelect');
    THEMES.forEach((t, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = t.name;
        themeSelect.appendChild(opt);
    });

    async function changeTheme() {
        const theme = THEMES[themeSelect.value];
        document.getElementById('topText').value = theme.defaultTop;
        document.getElementById('bottomText').value = theme.defaultBottom;
        
        try {
            currentOverlay = await loadImage(theme.overlayUrl);
            runGenerate();
        } catch (e) {
            console.warn("Overlay PNG not found yet. Add " + theme.overlayUrl + " to folder.");
            currentOverlay = null; 
            runGenerate(); // Render without it so you can test
        }
    }
    
    // Load initial defaults
    changeTheme();

    document.getElementById('beforeImage').addEventListener('change', async (e) => {
        if (e.target.files && e.target.files[0]) {
            const file = e.target.files[0];
            loadedBefore = await loadImage(file);
            document.getElementById('bText').textContent = '✓ ' + file.name;
            document.getElementById('bUploadBtn').classList.add('ready');
            runGenerate();
        }
    });
    
    document.getElementById('afterImage').addEventListener('change', async (e) => {
        if (e.target.files && e.target.files[0]) {
            const file = e.target.files[0];
            loadedAfter = await loadImage(file);
            document.getElementById('aText').textContent = '✓ ' + file.name;
            document.getElementById('aUploadBtn').classList.add('ready');
            runGenerate();
        }
    });

    function resetPosition(target) {
        document.getElementById(target + 'X').value = 0;
        document.getElementById(target + 'Y').value = 0;
        document.getElementById(target + 'Zoom').value = 100;
        runGenerate();
    }

    function loadImage(source) {
        return new Promise((resolve, reject) => {
            if (!source) { resolve(null); return; }
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error(`Failed to load image`));
            img.src = typeof source === 'string' ? source : URL.createObjectURL(source);
        });
    }

    function runGenerate() {
        if (!loadedBefore || !loadedAfter) return;

        const theme = THEMES[themeSelect.value];
        const W = theme.width;
        const H = theme.height;
        canvas.width = W;
        canvas.height = H;

        // Base Background (in case photos don't cover everything or overlay is missing)
        ctx.fillStyle = "#121212";
        ctx.fillRect(0, 0, W, H);

        if (theme.type === 'stack') {
            // Top Window
            drawPhoto(loadedBefore, 'b', 0, 0, W, H/2, W, H);
            // Bottom Window
            drawPhoto(loadedAfter, 'a', 0, H/2, W, H/2, W, H);
        } else {
            // Side-by-side
            drawPhoto(loadedBefore, 'b', 0, 0, W/2, H, W, H);
            drawPhoto(loadedAfter, 'a', W/2, 0, W/2, H, W, H);
        }

        // DRAW TRANSPARENT OVERLAY FRAME
        if (currentOverlay) {
            ctx.drawImage(currentOverlay, 0, 0, W, H);
        } else {
            // Fallback lines if PNG is missing so you can see the split
            ctx.strokeStyle = "#ff6b00";
            ctx.lineWidth = 10;
            if (theme.type === 'stack') {
                ctx.strokeRect(0,0,W,H);
                ctx.beginPath(); ctx.moveTo(0, H/2); ctx.lineTo(W, H/2); ctx.stroke();
            } else {
                ctx.strokeRect(0,0,W,H);
                ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
            }
        }

        // DRAW DYNAMIC TEXT
        const tText = document.getElementById('topText').value;
        const bText = document.getElementById('bottomText').value;
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 60px -apple-system, sans-serif";
        ctx.textAlign = "center";
        
        // Basic centered fallback text rendering. 
        // In the future, we can add exact text coordinates to the THEMES json!
        if (theme.type === 'stack') {
            ctx.fillText(tText, W/2, 100);
            ctx.fillText(bText, W/2, H - 40);
        } else {
            ctx.fillText(tText, W/4, 100);
            ctx.fillText(bText, (W/4)*3, 100);
        }

        canvas.style.display = 'block';
        document.getElementById('downloadBtn').style.display = 'block';
        document.getElementById('gestureHint').style.display = 'block';
    }

    function drawPhoto(img, prefix, clipX, clipY, clipW, clipH, fullW, fullH) {
        let zoom = document.getElementById(prefix + 'Zoom').value / 100;
        let baseScale = Math.max(clipW / img.width, clipH / img.height);
        let dw = img.width * baseScale * zoom;
        let dh = img.height * baseScale * zoom;
        
        let cx = clipX + (clipW / 2) + (document.getElementById(prefix + 'X').value / 100) * (clipW / 2);
        let cy = clipY + (clipH / 2) + (document.getElementById(prefix + 'Y').value / 100) * (clipH / 2);

        ctx.save();
        ctx.beginPath();
        ctx.rect(clipX, clipY, clipW, clipH);
        ctx.clip();
        ctx.drawImage(img, cx - dw / 2, cy - dh / 2, dw, dh);
        ctx.restore();
    }

    function downloadImage() {
        const link = document.createElement('a');
        link.download = 'SplitSnap_Export.jpeg';
        link.href = canvas.toDataURL('image/jpeg', 0.9);
        link.click();
    }

    // ==========================================
    // TOUCH GESTURE LOGIC (Untouched, works globally)
    // ==========================================
    let activeTarget = null;
    let startX = 0, startY = 0, initialSliderX = 0, initialSliderY = 0;
    let initialPinchDist = null, initialZoom = 100, isMouseDown = false;

    function getTargetFromPoint(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const theme = THEMES[themeSelect.value];
        const relX = clientX - rect.left;
        const relY = clientY - rect.top;
        if (theme.type === 'stack') return (relY < rect.height / 2) ? 'b' : 'a';
        else return (relX < rect.width / 2) ? 'b' : 'a';
    }

    canvas.addEventListener('touchstart', (e) => {
        if (!loadedBefore || !loadedAfter) return;
        if (e.touches.length === 1) {
            activeTarget = getTargetFromPoint(e.touches[0].clientX, e.touches[0].clientY);
            startX = e.touches[0].clientX; startY = e.touches[0].clientY;
            initialSliderX = parseFloat(document.getElementById(activeTarget + 'X').value);
            initialSliderY = parseFloat(document.getElementById(activeTarget + 'Y').value);
            initialPinchDist = null;
        } else if (e.touches.length === 2) {
            const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
            const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            activeTarget = getTargetFromPoint(midX, midY);
            initialPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            initialZoom = parseFloat(document.getElementById(activeTarget + 'Zoom').value);
        }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
        if (!activeTarget) return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const theme = THEMES[themeSelect.value];

        if (e.touches.length === 1 && !initialPinchDist) {
            const dx = e.touches[0].clientX - startX;
            const dy = e.touches[0].clientY - startY;
            let factorX = 200, factorY = 200;
            document.getElementById(activeTarget + 'X').value = Math.max(-200, Math.min(200, Math.round(initialSliderX + (dx / rect.width) * factorX)));
            document.getElementById(activeTarget + 'Y').value = Math.max(-200, Math.min(200, Math.round(initialSliderY + (dy / rect.height) * factorY)));
            runGenerate();
        } else if (e.touches.length === 2 && initialPinchDist) {
            const currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            document.getElementById(activeTarget + 'Zoom').value = Math.max(10, Math.min(300, Math.round(initialZoom * (currentDist / initialPinchDist))));
            runGenerate();
        }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
        if (e.touches.length === 0) { activeTarget = null; initialPinchDist = null; }
    });

    canvas.addEventListener('mousedown', (e) => {
        if (!loadedBefore || !loadedAfter) return;
        isMouseDown = true;
        activeTarget = getTargetFromPoint(e.clientX, e.clientY);
        startX = e.clientX; startY = e.clientY;
        initialSliderX = parseFloat(document.getElementById(activeTarget + 'X').value);
        initialSliderY = parseFloat(document.getElementById(activeTarget + 'Y').value);
    });

    window.addEventListener('mousemove', (e) => {
        if (!isMouseDown || !activeTarget) return;
        const rect = canvas.getBoundingClientRect();
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        document.getElementById(activeTarget + 'X').value = Math.max(-200, Math.min(200, Math.round(initialSliderX + (dx / rect.width) * 200)));
        document.getElementById(activeTarget + 'Y').value = Math.max(-200, Math.min(200, Math.round(initialSliderY + (dy / rect.height) * 200)));
        runGenerate();
    });

    window.addEventListener('mouseup', () => { isMouseDown = false; activeTarget = null; });

    canvas.addEventListener('wheel', (e) => {
        if (!loadedBefore || !loadedAfter) return;
        e.preventDefault();
        const target = getTargetFromPoint(e.clientX, e.clientY);
        const zoomInput = document.getElementById(target + 'Zoom');
        zoomInput.value = Math.max(10, Math.min(300, parseFloat(zoomInput.value) + (e.deltaY < 0 ? 5 : -5)));
        runGenerate();
    }, { passive: false });
</script>
</body>
</html>
